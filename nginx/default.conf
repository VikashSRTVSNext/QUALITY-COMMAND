server {
    listen 8080;
    server_name localhost;
    # Preserve the external host port when Docker maps 8082 to 8080.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html index.htm;

    location = / {
        return 302 /factory-command-center/;
    }

    location = /factory-command-center {
        return 301 /factory-command-center/;
    }

    # Missing fixtures and bundles must not return the HTML app shell.
    location /factory-command-center/demo-data/ {
        try_files $uri =404;
    }

    location /factory-command-center/assets/ {
        try_files $uri =404;
    }

    location /factory-command-center/ {
        try_files $uri $uri/ /factory-command-center/index.html;
    }

    location / {
        return 404;
    }
}
