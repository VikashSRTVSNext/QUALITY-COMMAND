server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    location = /health/live { return 200 'alive'; }
    location = /health/ready {
        try_files /factory-command-center/production-demo/index.html =503;
    }
    location = /factory-command-center/production-demo {
        return 308 /factory-command-center/production-demo/;
    }
    location ^~ /factory-command-center/production-demo/assets/ {
        try_files $uri =404;
    }
    location = /factory-command-center/production-demo/index.html {
        add_header Cache-Control no-store;
    }
    location /factory-command-center/production-demo/ {
        try_files $uri $uri/ /factory-command-center/production-demo/index.html;
    }
    location / { return 404; }
}