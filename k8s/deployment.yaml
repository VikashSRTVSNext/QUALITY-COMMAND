apiVersion: v1
kind: Service
metadata:
  name: factory-command-center
  namespace: nokia-factory-command-center
  labels:
    app: factory-command-center
spec:
  selector:
    app: factory-command-center
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: factory-command-center
  namespace: nokia-factory-command-center
  labels:
    app: factory-command-center
spec:
  replicas: 1
  selector:
    matchLabels:
      app: factory-command-center
  template:
    metadata:
      labels:
        app: factory-command-center
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      imagePullSecrets:
        - name: acr-auth
      containers:
        - name: factory-command-center
          image: tvsnext.azurecr.io/factory-command-center:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /run
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: factory-command-center
  namespace: nokia-factory-command-center
  annotations:
    nginx.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - digitwin.dyn.nesc.nokia.net
      secretName: frontend-nokia-tls
  rules:
    - host: digitwin.dyn.nesc.nokia.net
      http:
        paths:
          - path: /factory-command-center
            pathType: Prefix
            backend:
              service:
                name: factory-command-center
                port:
                  number: 80
