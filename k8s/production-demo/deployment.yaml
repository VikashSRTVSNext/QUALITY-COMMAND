apiVersion: v1
kind: Service
metadata:
  name: factory-production-demo
  namespace: nokia-factory-command-center
spec:
  selector:
    app: factory-production-demo
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: factory-production-demo
  namespace: nokia-factory-command-center
spec:
  replicas: 1
  selector:
    matchLabels:
      app: factory-production-demo
  template:
    metadata:
      labels:
        app: factory-production-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      imagePullSecrets:
        - name: acr-auth
      containers:
        - name: factory-production-demo
          image: tvsnext.azurecr.io/factory-production-demo:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: factory-production-demo
  namespace: nokia-factory-command-center
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - digitwin.dyn.nesc.nokia.net
      secretName: frontend-nokia-tls
  rules:
    - host: digitwin.dyn.nesc.nokia.net
      http:
        paths:
          - path: /factory-command-center/production-demo
            pathType: Prefix
            backend:
              service:
                name: factory-production-demo
                port:
                  number: 80